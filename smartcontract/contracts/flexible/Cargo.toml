[package]
name = "jointsave-flexible"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
jointsave-yield-vault = { path = "../yield-vault" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils", "alloc"] }
jointsave-yield-vault = { path = "../yield-vault", features = ["mock"] }
proptest = "1.4"
